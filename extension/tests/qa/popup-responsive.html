<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>VisCue popup responsive QA</title>
    <style>
      * { box-sizing: border-box; }
      html, body { margin: 0; min-height: 100%; background: #ebe8e4; font-family: "Instrument Sans", system-ui, sans-serif; color: #161616; }
      main { min-height: 100vh; padding: 28px; display: flex; align-items: flex-start; gap: 28px; overflow: auto; }
      figure { margin: 0; display: grid; gap: 10px; }
      figcaption { font-size: 13px; font-weight: 600; }
      iframe { display: block; border: 1px solid #d9d5cf; border-radius: 16px; background: #f7f5f2; box-shadow: 0 8px 24px rgba(22,22,22,.08); }
    </style>
  </head>
  <body>
    <main>
      <figure><iframe src="/popup.html" width="320" height="520" title="Popup 320 by 520"></iframe><figcaption>320 × 520</figcaption></figure>
      <figure><iframe src="/popup.html" width="360" height="560" title="Popup 360 by 560"></iframe><figcaption>360 × 560</figcaption></figure>
      <figure><iframe src="/popup.html" width="400" height="600" title="Popup 400 by 600"></iframe><figcaption>400 × 600</figcaption></figure>
    </main>
  </body>
</html>
