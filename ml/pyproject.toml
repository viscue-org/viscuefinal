[build-system]
requires = ["setuptools>=80,<82"]
build-backend = "setuptools.build_meta"

[project]
name = "viscue-ml"
version = "0.1.0"
description = "Leakage-resistant gesture intent model tooling for VIS CUE"
requires-python = ">=3.12,<3.13"

[tool.setuptools]
packages = ["viscue_ml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
